[DouyinParser]
enable = true
# 允许解析的群聊白名单
# 如果要允许所有群聊，请将此项设置为 ["*"]
allowed_groups = ["*"]

# 国外平台（YouTube/X/Instagram 等）本机网络不可达，需经代理访问。
# 容器内访问宿主机代理用 docker 网桥网关地址（docker0 通常为 172.17.0.1）。
# 留空 = 不使用代理；仅对国外平台生效，国内平台始终直连。
proxy = "http://172.17.0.1:7890"
# yt-dlp 单独使用的代理；留空则沿用上面的 proxy
ytdlp_proxy = ""

# 是否对未匹配已知平台的任意链接也尝试解析（yt-dlp 支持 1700+ 站点）。
# 开启可覆盖枚举外的站点，但会对普通网页产生无效请求，默认关闭。
generic-fallback = false
