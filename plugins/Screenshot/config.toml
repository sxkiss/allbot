[Screenshot]
enable = true
# 支持：截图https://example.com  或  截图 https://example.com  或  引用链接消息后发“截图”
commands = ["截图"]
# 双接口：screenshotsnap + microlink，并行请求，谁先成功用谁
providers = ["microlink", "screenshotsnap"]
api_base = "https://screenshotsnap.com/api/screenshot"
microlink_api = "https://api.microlink.io/"
timeout = 45
retry_count = 2
# 抓取分辨率（过大易触发 869 缩略图失败，发送前会再压成 JPEG）
screenshot_width = 1024
screenshot_height = 768
format = "png"
# 发送前规范化
max_dimension = 1280
max_file_size = 900000
jpeg_quality = 78
# 失败是否提示
notify_error = true
user_agent = "Mozilla/5.0 (allbot-Screenshot)"
