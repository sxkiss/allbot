# 钉钉 适配器（源自 bt 网关 octop-gateway 通道桥接）
# 说明：通道实现代码随仓库携带在 vendor/octop_gateway；平台 SDK 需按需安装：dingtalk-stream (pip install dingtalk-stream)
# 启停为热插拔即时生效；缺少凭据或 SDK 时适配器不会崩溃，仅记录 warning 并等待。

[adapter]
name = "dingtalk"
enabled = false
module = "adapter.dingtalk"
class = "DingtalkGatewayAdapter"
replyQueue = "allbot_reply:dingtalk"
replyMaxRetry = 3
replyRetryInterval = 2
logEnabled = true
logLevel = "INFO"

[dingtalk]
enable = false
platform = "dingtalk"
kind = "dingtalk"
app_key = ""
app_secret = ""
robot_code = ""
botWxid = "dingtalk-bot"

[dingtalk.redis]
queue = "allbot"
host = "127.0.0.1"
port = 6379
db = 0
password = ""
