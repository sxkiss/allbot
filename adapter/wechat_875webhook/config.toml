[adapter]
name = "wechat_875webhook"
enabled = true
module = "adapter.wechat_875webhook"
class = "Wechat875Adapter"
replyQueue = "allbot_reply:wechat875webhook"
replyMaxRetry = 3
replyRetryInterval = 2
logEnabled = true
logLevel = "INFO"

[wechat875]
enable = true
platform = "wechat875"
baseUrl = "http://172.17.0.1:18062"
# 老 ws/sync 地址仅为客户端构造兼容保留，本适配器入站不使用（只走 webhook）
wsUrl = "ws://172.17.0.1:18089/ws/sync"
apiPrefix = "/api"
requestTimeout = 20
reconnectInterval = 5
deviceName = "iPad"
# 可选：平台别名，用于回复队列 platform 过滤（默认仅 wechat875）
# aliases = ["wechat875", "wx875"]

# 原始包缓存（供引用消息按 svr_id 反查被引用原消息）：只进 Redis、不落文件。
# 收包时按 new_msg_id/svr_id/id 各存一份完整原始包，TTL 到点自动过期。
rawCachePrefix = "w875:raw:"
rawCacheTtlSec = 604800   # 7 天

# 多账户：每个账户一张卡密 + 独立设备名/设备码（可选）
# 注：本文件为源码仓库示例，凭据/token 均为占位符，部署时请填入真实值。
# 生产运行目录（容器挂载）的 config.toml 才是真值所在，切勿把真值提交进仓库。
[[wechat875.accounts]]
wxid = "wx875_slot_main"
authcode = "REPLACE_WITH_AUTHCODE"
deviceName = "iPad"
deviceId = ""

# ===== webhook 链路（本独立适配器专属）=====
# inboundUrl   : 登录成功后由适配器调协议 /api/Webhook/Set 写入的回调地址（9090 入站）
# subscribeUrl : 本适配器作为 WS 客户端连的 9090 订阅端点（收协议回调封装）
# 两者 token 为 webhook 订阅鉴权令牌，部署时填入真实值。
# 本适配器只走这条链路：缺 inboundUrl/subscribeUrl 直接拒绝启动，不回退 ws/sync。
[wechat875.webhook]
inboundUrl = "http://172.17.0.1:9090/webhook/inbound?token=REPLACE_WITH_TOKEN"
subscribeUrl = "ws://127.0.0.1:9090/webhook/subscribe?token=REPLACE_WITH_TOKEN"
messageTypes = ["*"]
includeSelfMessage = true
timeout = 5
retryCount = 3

[wechat875.redis]
host = "127.0.0.1"
port = 6379
db = 0
password = ""
queue = "allbot:in:wechat875"
