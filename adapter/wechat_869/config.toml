[adapter]
name = "wechat_869"
enabled = true
module = "adapter.wechat_869"
class = "Wechat869Adapter"
replyQueue = "allbot_reply:wechat_869"
replyMaxRetry = 3
replyRetryInterval = 2
logEnabled = true
logLevel = "INFO"

[wechat869]
enable = true
platform = "wechat869"
# 869 协议网关（独立容器 wxserver 对外入口）
host = "l.sxkiss.top"
port = 5253
wsUrl = "ws://l.sxkiss.top:5253/ws/GetSyncMsg"
protocolVersion = "869"
adminKey = ""
# 已迁移到适配器目录内的独立会话/状态文件（不触发扫码）
sessionFile = "adapter/wechat_869/data/session.json"
stateFile = "adapter/wechat_869/data/state.json"
reconnectInterval = 5
requestTimeout = 20

[wechat869.redis]
host = "127.0.0.1"
port = 6379
db = 0
password = ""
queue = "allbot:in:wechat_869"

# 多账户：一个卡密/key 对应一个号，多设备并行在线（不配置时用上面的 sessionFile 兼容单账户 main）
# [[wechat869.accounts]]
# key = "acct_a"              # 稳定标识（后台账号下拉显示）
# authcode = "卡密A"          # 该账户的 key / 卡密
# deviceName = "ipad"         # ipad 或 mac
# deviceId = ""
# sessionFile = "adapter/wechat_869/data/session_acct_a.json"  # 每账户独立会话（可选，按 key 自动生成）

# [[wechat869.accounts]]
# key = "acct_b"
# authcode = "卡密B"
# deviceName = "mac"
