# MQTT 适配器（源自 bt 网关 octop-gateway 通道桥接）
# 说明：通道实现代码随仓库携带在 vendor/octop_gateway；平台 SDK 需按需安装：paho-mqtt (pip install paho-mqtt)
# 启停为热插拔即时生效；缺少凭据或 SDK 时适配器不会崩溃，仅记录 warning 并等待。

[adapter]
name = "mqtt"
enabled = false
module = "adapter.mqtt"
class = "MqttGatewayAdapter"
replyQueue = "allbot_reply:mqtt"
replyMaxRetry = 3
replyRetryInterval = 2
logEnabled = true
logLevel = "INFO"

[mqtt]
enable = false
platform = "mqtt"
kind = "mqtt"
host = "127.0.0.1"
port = 8883
subscribe_topic = "allbot/in"
publish_topic = "allbot/out"
username = ""
password = ""
# MQTTConfig 真实字段（默认 tls_enabled=True / qos=2，本地明文 broker 需显式调整）
transport = "tcp"
clean_session = true
qos = 0
tls_enabled = false
botWxid = "mqtt-bot"

[mqtt.redis]
queue = "allbot"
host = "127.0.0.1"
port = 6379
db = 0
password = ""
