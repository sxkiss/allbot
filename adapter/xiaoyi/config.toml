# 小一(华为云) 适配器（源自 bt 网关 octop-gateway 通道桥接）
# 说明：通道实现代码随仓库携带在 vendor/octop_gateway；平台 SDK 需按需安装：无需额外 SDK（内置协议实现）
# 启停为热插拔即时生效；缺少凭据或 SDK 时适配器不会崩溃，仅记录 warning 并等待。

[adapter]
name = "xiaoyi"
enabled = false
module = "adapter.xiaoyi"
class = "XiaoyiGatewayAdapter"
replyQueue = "allbot_reply:xiaoyi"
replyMaxRetry = 3
replyRetryInterval = 2
logEnabled = true
logLevel = "INFO"

[xiaoyi]
enable = false
platform = "xiaoyi"
kind = "xiaoyi"
ak = ""
sk = ""
agent_id = ""
botWxid = "xiaoyi-bot"

[xiaoyi.redis]
queue = "allbot"
host = "127.0.0.1"
port = 6379
db = 0
password = ""
