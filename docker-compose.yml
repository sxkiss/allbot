services:
  allbot-protocol875:
    build: .
    image: ghcr.nju.edu.cn/sxkiss/allbot-protocol875:latest
    container_name: allbot-protocol875
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "18062:18062"   # 875 HTTP API
      - "18089:18089"   # 875 WebSocket
      - "18080:18080"   # 人脸验证
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - ./data/allbot:/app/data
      - ./data/redis:/data/redis
