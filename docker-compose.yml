services:
  mysql:
    image: mysql:8.0
    container_name: allbot-license-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wxserver_2026
      MYSQL_DATABASE: weixin
      MYSQL_USER: weixin
      MYSQL_PASSWORD: wxserver_2026
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwxserver_2026"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: allbot-license-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  allbot:
    image: sxkiss/allbot:feat-wxserver-license
    pull_policy: always
    container_name: allbot-license
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9091:9090"
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - ./main_config.toml:/app/main_config.toml
      - ./plugins:/app/plugins
      - ./adapter:/app/adapter
      - ./resource:/app/resource
      - ./database:/app/database
      - ./data/allbot:/app/data
      - ./logs:/app/logs
    environment:
      - WX_HOST=127.0.0.1
      - WX_PORT=5253
      - WX_AUTH_SERVER=http://v.sxkiss.top
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=weixin
      - MYSQL_PASSWORD=wxserver_2026
      - MYSQL_DATABASE=weixin
      - MYSQL_PARAMS=charset=utf8mb4&parseTime=true&loc=Local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
      - WX_ADMIN_KEY=sk-allbot
