appname = WeChatPadProMAX
httpaddr = "0.0.0.0"
httpport = 18062
runmode = prod
graceful = false
user_token_key = ""
pad08enabled = true
padfaceofficialhandoff = true
pad_face_verifier_enabled = true
pad_face_verifier_port = 18080
pad_face_ca_cert_path = ""
pad_face_public_base_url = ""
viewspath = "template"
autorender = false
copyrequestbody = true
EnableDocs = true
serve_swagger = true
mcp_enabled = true
mcp_write_enabled = false
mcp_allowed_hosts = ""
mcp_allowed_origins = ""
sessionon = true
SessionName = "WeChatPadProMAX"
ServerName = "WeChatPadProMAX"
redislink = 127.0.0.1:6379
redispass = ""
redisdbnum = 8
longlinkenabled = true
websocket = true
websocketport = 18089
websocket_ticket_ttl_seconds = 300
websocket_sync_fallback_interval_seconds = 15
websocket_sync_fallback_grace_seconds = 30
websocket_allowed_origins = ""
push_websocket = true
push_webhook = true
push_rabbitmq = false
msgpush = false
mmtls_verbose_logging = false
rabbitmq = false
rabbitmqurl = "amqp://guest:guest@localhost:5672/"
# 核心：指向插件市场公网地址 (插件市场需在此域名下提供 /access-tokens/validate 接口)
authserver = "https://v.sxkiss.top"

# 静态目录映射：把 /swagger 指到 /app/swagger（875 协议 API 文档，从原版镜像提取）
staticdir = swagger:/app/swagger
