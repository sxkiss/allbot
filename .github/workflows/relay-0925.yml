name: Relay 0925 binaries
on:
  push:
    branches:
      - feat/wxserver875-license
    paths:
      - ".github/workflows/relay-0925.yml"
jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取官方 9.25 镜像
        run: |
          docker pull wechatpadpro/wechatpadprobusiness:v2026.09.25.1
      - name: 提取关键二进制
        run: |
          mkdir -p /tmp/bin
          c=$(docker create wechatpadpro/wechatpadprobusiness:v2026.09.25.1)
          docker cp $c:/app/wechatpadpromax08 /tmp/bin/wechatpadpromax08.0925
          docker cp $c:/app/pad-face-verify-linux-x64 /tmp/bin/pad-face-verify.0925
          docker cp $c:/app/metadata.json /tmp/bin/metadata.0925.json
          docker rm $c
          ls -lh /tmp/bin/
      - name: 上传 release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wppro-0925-binaries
          files: /tmp/bin/*
