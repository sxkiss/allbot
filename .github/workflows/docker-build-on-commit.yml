name: Docker Build (875 protocol service)

on:
  push:
    branches:
      - feat/wxserver875-license
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "entrypoint.sh"
      - "conf875/**"
      - "wxserver_runtime/**"
      - "lib/**"
      - "lib875/**"
      - "wechatpad875"
      - ".github/workflows/docker-build-on-commit.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/allbot-protocol875:${{ github.ref_name }}
