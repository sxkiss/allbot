name: Docker Multi-arch Build on Commit

on:
  push:
    branches:
      - main
      - feat/wxserver-license
      - feat/wxserver875-license
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "wxserver"
      - "**.py"
      - "requirements.txt"
      - "**.conf"
      - "**.toml"
      - "**.yml"
      - "**.sh"
      - ".github/workflows/docker-build-on-commit.yml"
      - ".dockerignore"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v2

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
          install: true

      - name: 创建多架构构建器
        run: |
          docker buildx create --name multiarch --use
          docker buildx inspect --bootstrap

      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取短 SHA
        id: vars
        run: echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 获取分支名
        id: branch
        run: echo "BRANCH=$(echo ${{ github.ref_name }} | tr '/' '-')" >> $GITHUB_ENV

      - name: 设置 latest 标签
        id: latest
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "LATEST_TAG=latest" >> $GITHUB_ENV
          else
            echo "LATEST_TAG=" >> $GITHUB_ENV
          fi

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v4
        with:
          context: .
          builder: multiarch
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/allbot:${{ env.BRANCH }}
            ${{ secrets.DOCKERHUB_USERNAME }}/allbot:${{ env.GIT_SHA }}
            ${{ env.LATEST_TAG && format('{0}/allbot:{1}', secrets.DOCKERHUB_USERNAME, env.LATEST_TAG) || '' }}
            ghcr.io/${{ github.repository_owner }}/allbot:${{ env.BRANCH }}
            ghcr.io/${{ github.repository_owner }}/allbot:${{ env.GIT_SHA }}
            ${{ env.LATEST_TAG && format('ghcr.io/{0}/allbot:{1}', github.repository_owner, env.LATEST_TAG) || '' }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/allbot:latest
          cache-to: type=inline,mode=max
